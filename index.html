<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>coccolith</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #00000a; overflow: hidden; }
    #c { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 14px; left: 16px;
      color: rgba(255,255,255,0.5); font: 11px monospace;
      pointer-events: none; line-height: 1.8;
    }
    /* 全画面ボタン（HUD 左上。#hud は pointer-events: none なのでここだけ押せるように） */
    #fs-btn {
      width: 18px; height: 18px; padding: 0; margin: -6px 6px -6px 0;
      background: none; border: none; vertical-align: middle;
      color: rgba(255,255,255,0.6); cursor: pointer; pointer-events: auto;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    #fs-btn:hover { color: #fff; }
    #fs-btn svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    /* 設定ボタン（HUD 3行目の歯車）と、押すと開くハンドルの反転設定パネル */
    #settings-btn {
      width: 18px; height: 18px; padding: 0; margin: -6px 0;
      background: none; border: none; vertical-align: middle;
      color: rgba(255,255,255,0.6); cursor: pointer; pointer-events: auto;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    #settings-btn:hover, #settings-btn.open { color: #fff; }
    #settings-btn svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; }
    #settings {
      position: fixed; top: 82px; left: 12px; z-index: 20;
      display: none; flex-direction: column; gap: 5px;
      padding: 8px 10px; background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
      color: rgba(255,255,255,0.7); font: 11px monospace;
    }
    #settings.open { display: flex; }
    #settings .set-title { color: rgba(255,255,255,0.5); margin-bottom: 2px; }
    #settings .set-row { display: flex; align-items: center; gap: 6px; }
    #settings .set-row[hidden] { display: none; }
    #settings .set-row span { flex: 1; margin-right: 6px; white-space: nowrap; }
    #settings button {
      padding: 0 8px; background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.35); border-radius: 10px;
      color: rgba(255,255,255,0.6); font: 16px system-ui, sans-serif; line-height: 20px;   /* ⇅ ⇆ の矢印が小さく見えないよう文字より大きめ */
      cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #settings button.set-speed { flex: 1; font: 12px monospace; }   /* 倍率は矢印ほど大きくしなくてよい */
    #settings button.on { background: rgba(186,205,216,0.85); border-color: rgba(186,205,216,1); color: #00000a; }
    .hud-icon {
      width: 22px; height: 22px; margin: -6px 0 -6px -4px;
      vertical-align: middle; opacity: 0.8;
    }
    #coin-box {
      display: inline-flex; align-items: center; gap: 3px;
      margin-left: 10px; padding: 0 7px 0 3px;
      border: 1px solid rgba(255,255,255,0.35); border-radius: 10px;
      line-height: 18px; vertical-align: middle;
      position: relative; top: -2px;
      visibility: hidden;   /* lat/lon が入るまで隠す（起動直後に左へずれて見えるのを防ぐ） */
    }
    #coin-box.ready { visibility: visible; }
    #coin-box img { width: 18px; height: 18px; }
    #coin-num { display: inline-block; min-width: 1ch; color: rgba(255,255,255,0.8); transition: transform 0.12s ease-out; }
    #coin-num.bump { transform: scale(1.4); }
    /* コイン数は JUMP と同じく、カーソルを合わせると縁が明るくなる。つかんで投入口へドラッグできる（coinDrop.js） */
    #coin-box { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #coin-box:hover, #coin-box.grabbing { border-color: rgba(255,255,255,0.7); }
    #coin-box:hover #coin-num, #coin-box.grabbing #coin-num { color: #fff; }
    #coin-box.grabbable { cursor: grab; }
    #coin-box.grabbing { cursor: grabbing; }
    #coin-box img { pointer-events: none; -webkit-user-drag: none; }
    #coin-ghost {
      position: fixed; z-index: 30; width: 60px; height: 60px; margin: -30px 0 0 -30px;   /* 指に隠れないよう大きめ（元画像より大きいので少しぼやける） */
      pointer-events: none; transition: transform 0.12s ease-out;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    }
    #coin-ghost.over { transform: scale(1.4); }
    #compass {
      position: fixed; top: 10px; right: 10px;
      pointer-events: none;
    }
    /* JUMP: コンパスの下。押すと行き先の一覧が開き、選ぶと施設内へワープ */
    #jump {
      position: fixed; top: 104px; right: 10px; width: 88px; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    /* スマホの幅では HUD 1行目（訪問者数まで）がコンパスに重なるので、HUD を少し左へ、コンパスと JUMP を 1 行ぶん下げる */
    @media (max-width: 500px) {
      #hud     { left: 10px; }
      #compass { top: 36px; }
      #jump    { top: 130px; }
    }
    #jump button {
      padding: 0 8px; background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.35); border-radius: 10px;
      color: rgba(255,255,255,0.8); font: 11px monospace; line-height: 18px;
      letter-spacing: 0.05em; white-space: nowrap;
      cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #jump #jump-btn { letter-spacing: 0.25em; padding: 0 calc(8px - 0.25em) 0 8px; }   /* 字間を広げ、末尾の余白ぶん右を詰めて中央に */
    #jump button:hover { border-color: rgba(255,255,255,0.7); color: #fff; }
    #jump button:active { transform: scale(0.94); }
    #jump-list { display: none; flex-direction: column; align-items: center; gap: 4px; }
    #jump.open #jump-list { display: flex; }
    #jump.open #jump-btn { border-color: rgba(255,255,255,0.7); color: #fff; }
    #veth-ind {
      position: fixed; width: 28px; height: 28px;
      pointer-events: none;
    }
    #ctrl {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3); font: 11px monospace;
      pointer-events: none; white-space: nowrap;
    }
    @media (pointer: coarse) { #ctrl { display: none; } }
    #copyright {
      position: fixed; bottom: 6px; left: 50%;
      transform: translateX(-50%); z-index: 20;
      color: rgba(255,255,255,0.3); font: 10px monospace;
      white-space: nowrap;
    }
    #copyright a { color: inherit; text-decoration: none; }
    /* Virtual joystick */
    .joy-wrap {
      position: fixed; width: 110px; height: 110px; z-index: 20;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #joy-right { bottom: 28px; right: 28px; }
    .joy-base {
      position: absolute; inset: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.10);
      border: 2px solid rgba(255,255,255,0.28);
    }
    .joy-handle {
      position: absolute; width: 96px; height: 96px;
      background: url(/ui/handle.png) center / contain no-repeat;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }
    /* 直進ボタン */
    #drive-btn {
      position: fixed; bottom: 28px; left: 28px; z-index: 20;
      width: 110px; height: 110px; padding: 0; border: none;
      background: url(/ui/drive.png) center / contain no-repeat;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; cursor: pointer;
      transition: transform 0.12s, opacity 0.08s;
    }
    #drive-btn.pressed { transform: scale(0.9); opacity: 0.75; }
    #drive-btn.reverse { transform: translateY(8px) rotate(180deg) scale(0.9); }  /* 後退中は矢印を下向きに */
    /* 俯瞰 ⇄ 主観 切替ボタン（sabちゃんと離すため、左右のコントローラーの中心より少し下げる） */
    #tab-btn {
      position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%);
      z-index: 20; width: 80px; height: 80px; padding: 0; border: none;
      background: url(/ui/obeye.png) center / contain no-repeat;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
      cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #tab-btn.overview { background-image: url(/ui/subeye.png); }
    #tab-btn.insab { background-image: url(/ui/insab.png); }   /* 室内の主観中: sabちゃん入りの視点に戻る */
    /* 自動撮影モード（?shot=1。shot.js）: 下のコントローラーと操作説明を隠し、HUD は残す */
    body.shot #drive-btn, body.shot #joy-right, body.shot #tab-btn, body.shot #ctrl { display: none; }
    /* 室内⇄屋外の切り替え時の暗転 */
    #fade {
      position: fixed; inset: 0; z-index: 30; background: #000;
      opacity: 0; pointer-events: none; transition: opacity 0.35s;
    }
    #tab-btn:active { transform: translateX(-50%) scale(0.9); }
    /* 花の切り抜きページ（イーゼルのキャンバスをタップで開く。flowerCut.js） */
    #flower-cut {
      position: fixed; inset: 0; z-index: 40;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: rgba(0,0,10,0.92); color: rgba(255,255,255,0.8); font: 12px monospace;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #flower-cut .fc-stage { position: relative; width: min(82vw, 62vh); aspect-ratio: 1; }
    #flower-cut .fc-stage img, #flower-cut .fc-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #flower-cut .fc-stage img { image-rendering: pixelated; }
    #flower-cut .fc-shade { fill: rgba(0,0,10,0.6); }
    #flower-cut .fc-poly { fill: none; stroke: #BFF4FF; stroke-width: 2px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
    #flower-cut .fc-handle {
      position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
      border-radius: 50%; background: #BFF4FF;
      cursor: grab; touch-action: none;
    }
    #flower-cut .fc-handle::after { content: ''; position: absolute; inset: -14px; border-radius: 50%; }   /* 点は小さく、指で掴む当たりは広く */
    #flower-cut .fc-handle.active { cursor: grabbing; }
    #flower-cut .fc-buttons { display: flex; gap: 12px; }
    #flower-cut button {
      padding: 0 14px; letter-spacing: 0.15em; background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.35); border-radius: 12px;
      color: rgba(255,255,255,0.8); font: 12px monospace; line-height: 26px;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    #flower-cut button:hover { border-color: rgba(255,255,255,0.7); color: #fff; }
    #flower-cut .fc-ok { background: rgba(191,244,255,0.85); border-color: #BFF4FF; color: #00000a; padding: 0 22px; }
    /* ドット絵の平面ページ（ツリーハウスの扉をタップで開く。pixelScene.js）。全画面にせず暗い背景の上に置く */
    #pixel-scene {
      position: fixed; inset: 0; z-index: 40;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: rgba(0,0,10,0.92);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #pixel-scene .ps-art { display: block; image-rendering: pixelated; }
    #pixel-scene .ps-text {
      --dot: 4px;   /* 絵の 1 ドットの大きさ（pixelScene.js で入れる） */
      box-sizing: border-box; max-width: 96vw; min-height: calc(var(--dot) * 20);   /* 枠を含めて 20 ドット分 */
      padding: calc(var(--dot) * 2) calc(var(--dot) * 3);
      background: rgba(10,12,24,0.88); border: var(--dot) solid #5F638C;
      color: #EFEDE6; font: 12px/1.7 monospace; white-space: pre-wrap; overflow-wrap: anywhere;
      font-size: max(10px, calc(var(--dot) * 3));   /* 絵の 1 ドットの 3 倍。1 行がウィンドウの幅に収まる大きさ */
    }
    #pixel-scene .ps-text a { color: #8FD3E8; text-decoration: underline; text-underline-offset: 3px; }
    #pixel-scene button {
      padding: 0 14px; letter-spacing: 0.15em; background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.35); border-radius: 12px;
      color: rgba(255,255,255,0.8); font: 12px monospace; line-height: 26px;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    #pixel-scene button:hover { border-color: rgba(255,255,255,0.7); color: #fff; }
    #pixel-scene .ps-label {
      position: absolute; transform: translate(calc(-50% - 2ch - 0.16em), -100%); pointer-events: none;   /* 真ん中から 2 文字ぶん左へ */
      color: #fff; font: 15px monospace; letter-spacing: 0.08em; text-shadow: 0 0 3px #000;
    }
    #pixel-scene .ps-label[hidden] { display: none; }
    #doc-viewer {
      position: fixed; inset: 0; z-index: 41;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: rgba(0,0,10,0.95);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #doc-viewer .dv-tabs { display: flex; gap: 8px; }
    /* 画像の大きさが変わってもボタン・タブ・CLOSE が動かないよう、画像の置き場の大きさを決めておき、その中に収める */
    #doc-viewer .dv-stage {
      display: grid; grid-template-columns: 32px min(100vw - 96px, 900px) 32px; gap: 8px;
      justify-content: center; align-items: center; height: 70vh; width: 100%;
    }
    #doc-viewer .dv-img { justify-self: center; max-width: 100%; max-height: 70vh; object-fit: contain; touch-action: none; }
    #doc-viewer[data-cat="icon"] .dv-img { width: 240px; height: 240px; }   /* アイコンは元の大きさがばらばらなので、coin_icon（240px）に揃える */
    #doc-viewer .dv-title {
      max-width: 90vw; overflow: hidden; text-overflow: ellipsis;   /* 長いタイトルでも 1 行に収める */
      color: #EFEDE6; font: 12px monospace; letter-spacing: 0.08em; white-space: pre;
    }
    #doc-viewer button {
      padding: 0 14px; letter-spacing: 0.15em; background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.35); border-radius: 12px;
      color: rgba(255,255,255,0.8); font: 12px monospace; line-height: 26px;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    #doc-viewer button:hover, #doc-viewer .dv-tabs button.active { border-color: rgba(255,255,255,0.7); color: #fff; }
    #doc-viewer .dv-prev, #doc-viewer .dv-next { flex: none; padding: 0; width: 32px; font-size: 20px; line-height: 40px; border-radius: 16px; }
    /* ページを開いてから最初のフレームを描くまでのローディング表示（ドット絵のパラパラ漫画）。描き始めたら main.js が消す
       絵は scripts/import-loading.mjs で txt から書き出す。テロップ（番号のない絵）はコマの上に重ねる */
    #loading {
      position: fixed; inset: 0; z-index: 100; background: #00000a;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s; pointer-events: none;
    }
    #loading.done { opacity: 0; }
    #loading .ld-stage { position: relative; width: 192px; height: 192px; }   /* 64 ドットを 3 倍に */
    #loading .ld-stage > div { position: absolute; inset: 0; background-repeat: no-repeat; image-rendering: pixelated; }
    @keyframes ld-flip { to { background-position-x: 100%; } }
    body.shot #loading { display: none; }
    /* loading:begin */
