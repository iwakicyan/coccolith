name: Post to Bluesky

# 4 時間ごとに惑星内のランダムな地点を撮って @planet-coccolith.bsky.social に投稿する
# （UTC の 3,7,11… 時 = JST の 0,4,8,12,16,20 時。混雑時は数十分遅れることがある）
# 1 時間後にもう一度起き、その回の投稿がまだなければ（ランナーが取れなかった・途中で失敗したなど）やり直す
on:
  schedule:
    - cron: '0 3-23/4 * * *'   # 本番
    - cron: '0 */4 * * *'      # やり直し（JST の 1,5,9,13,17,21 時）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluesky
  cancel-in-progress: false

jobs:
  # やり直しの回は、直近 RETRY_WINDOW 分以内に投稿があれば skip を立てて投稿しない
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: github.event.schedule == '0 */4 * * *'
        env:
          RETRY_WINDOW: 100
        run: |
          # 朝の動画の投稿（bluesky-video.yml）は数えない
          last=$(curl -fsS "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=planet-coccolith.bsky.social&limit=5&filter=posts_no_replies" | jq -r '[.feed[] | select(.post.embed["$type"] != "app.bsky.embed.video#view")][0].post.record.createdAt // empty')
          echo "最後の投稿: ${last:-なし}"
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt $(( RETRY_WINDOW * 60 )) ]; then
            echo "本番の回で投稿済みなのでやり直さない"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  post:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04   # ubuntu-latest は 2026-10-19 から Ubuntu 26 に移る。Playwright の依存が揃うまでは固定しておく
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0   # 看板の更新履歴（vite.config.js）が git log を読むので全履歴を取る
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build
      - run: npm run shot
      - run: npm run post
        env:
          BLUESKY_HANDLE: planet-coccolith.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      - uses: actions/upload-artifact@v4   # 撮れた画像を数日だけ残す（見え方の確認用）
        if: always()
        with:
          name: shot-${{ github.run_id }}
          path: shots/
          retention-days: 7
          if-no-files-found: ignore
